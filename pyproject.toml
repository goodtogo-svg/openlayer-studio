[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "openlayer-studio"
version = "0.5.0.dev0"
description = "Local-first layer extraction and reconstruction toolkit with Photoshop, Illustrator and InDesign script handoff"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "樂易思維整合｜King Jam AI"}]
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<13", "PyMuPDF>=1.24,<2", "psd-tools>=1.10,<2", "vtracer==1.0.0a4"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
fonts = ["fonttools>=4.50,<5"]
graphics = ["pikepdf==10.17.0"]
[project.scripts]
ali = "ali.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
"ali.vector_rebuild" = ["data/*.json", "data/fonts/*"]
